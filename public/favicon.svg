<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <clipPath id="yarn-ball-clip">
      <circle cx="30" cy="30" r="22" />
    </clipPath>
  </defs>

  <!-- Trailing yarn tail with dark outline + rose core for contrast on light and dark tabs -->
  <path
    d="M 45 45 C 51 49, 58 46, 57 39 C 56 34, 50 36, 52 42 C 54 48, 60 52, 56 58"
    stroke="#2d1f3d"
    stroke-width="6"
    stroke-linecap="round"
  />
  <path
    d="M 45 45 C 51 49, 58 46, 57 39 C 56 34, 50 36, 52 42 C 54 48, 60 52, 56 58"
    stroke="#e8b4c8"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Main ball of yarn in Spun Blossom Rose (#e8b4c8) -->
  <circle cx="30" cy="30" r="22.5" fill="#e8b4c8" />

  <!-- Subtle darker shadow crescent for 3D roundness -->
  <path
    d="M 13 44 A 22 22 0 0 0 49 17 A 24 24 0 0 1 13 44 Z"
    fill="#d79ab3"
    opacity="0.65"
    clip-path="url(#yarn-ball-clip)"
  />

  <!-- Crisp crisscrossing yarn strands inside the ball -->
  <g clip-path="url(#yarn-ball-clip)" stroke-linecap="round">
    <!-- Back/left diagonal wraps -->
    <path d="M 8 24 Q 20 14 34 8" stroke="#2d1f3d" stroke-width="3.2" />
    <path d="M 6 33 Q 22 19 42 10" stroke="#2d1f3d" stroke-width="3.2" />
    <path d="M 9 41 Q 26 25 48 15" stroke="#2d1f3d" stroke-width="3.2" />

    <!-- Right/lower sweeping wraps -->
    <path d="M 28 52 Q 41 42 52 26" stroke="#2d1f3d" stroke-width="3.2" />
    <path d="M 37 53 Q 46 46 54 35" stroke="#2d1f3d" stroke-width="3.2" />

    <!-- Front center cross-band wraps (with light cream highlight strands) -->
    <path d="M 10 17 Q 25 29 36 53" stroke="#e8b4c8" stroke-width="6.5" />
    <path d="M 15 11 Q 30 24 41 49" stroke="#e8b4c8" stroke-width="6.5" />

    <path d="M 9 19 Q 24 30 34 53" stroke="#2d1f3d" stroke-width="3.2" />
    <path d="M 14 12 Q 29 24 40 50" stroke="#2d1f3d" stroke-width="3.2" />
    <path d="M 21 8 Q 35 19 46 45" stroke="#2d1f3d" stroke-width="3.2" />

    <!-- Soft highlight glint -->
    <path d="M 17 15 Q 24 20 29 27" stroke="#fdf9f3" stroke-width="1.8" opacity="0.75" />
  </g>

  <!-- Outer Deep Mulberry Plum (#2d1f3d) contour -->
  <circle cx="30" cy="30" r="22.5" stroke="#2d1f3d" stroke-width="3.6" />
</svg>
